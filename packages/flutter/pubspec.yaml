name: algo_widget
description: >-
  Algo Widget for Flutter — in-app bug reporting with screen recording, voice
  narration, a recorded interaction trace, and automatic crash capture.
version: 0.3.0
repository: https://github.com/algosoftbd/algo-widget-mobile
issue_tracker: https://github.com/algosoftbd/algo-widget-mobile/issues
documentation: https://github.com/algosoftbd/algo-widget-mobile/blob/main/docs/PROTOCOL.md

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  # The report panel IS a WebView — it presents the same page the web widget
  # serves, so the form, the draft store, the annotation UI and the countdown
  # are one implementation reaching four clients. First-party (flutter.dev).
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
