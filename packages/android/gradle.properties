# A standalone Gradle build inherits none of the properties an app project sets,
# which is why this file is easy to forget and why its absence surfaces as a
# failure inside an internal AGP task rather than as a missing setting.
android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
