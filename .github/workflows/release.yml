# Publishing the Algo Widget mobile SDKs.
#
# DISPATCHED AGAINST A TAG, and per-package. A tag names exactly one package and
# one version:
#
#     react-native-v0.1.0   → npm  @algosoftltd/algo-widget-react-native
#     flutter-v0.1.0        → pub.dev  algo_widget
#
# One tag per package rather than one version for the repository, because the
# four packages have four release cadences and forcing them to move together
# would mean publishing a Dart package to fix a Kotlin bug. The wire contract is
# what keeps them compatible, and CI's `contract` job is what keeps the contract
# honest — a shared version number would only look like a guarantee.
#
# The native cores are NOT published here. Android goes to Maven and iOS is
# consumed straight from this Git repository by SPM, so a tag is all iOS needs.
name: Release

# RUN IT AGAINST THE TAG, not against main with the tag as an input:
#
#     gh workflow run release.yml --ref react-native-v0.1.1
#
# or pick the tag in the "Run workflow" ref selector. That is not a style
# preference — pub.dev's automated publishing authenticates this run by OIDC and
# checks the ref the workflow ran for against its configured tag pattern. A
# workflow dispatched on `main` carrying a tag STRING would be refused, because
# the claim it presents says `main`, and no amount of checking out the tag
# afterwards changes what the token says.
#
# `version.yml` creates the tag and a DRAFT release; this publishes. Two steps
# on purpose: npm and pub.dev both refuse to replace a published version, so the
# gap between them is the last place a wrong number is still free.
on:
  workflow_dispatch:

permissions:
  contents: read
  # pub.dev and npm both authenticate with a short-lived OIDC token rather than
  # a long-lived secret. There is no publish credential in this repository to
  # leak, which matters more than usual for a repo that is public.
  id-token: write

jobs:
  react-native:
    # A tag ref, and the right prefix. Dispatching on a branch would otherwise
    # run the publish against whatever `package.json` says on that branch, which
    # is exactly the accident the tag-vs-manifest check below exists to catch —
    # better to refuse before doing any work.
    if: startsWith(github.ref, 'refs/tags/react-native-v')
    runs-on: ubuntu-latest
    environment: release
    defaults:
      run:
        working-directory: packages/react-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: packages/react-native/package-lock.json
      - run: npm ci

      # The tag is the source of truth, and a mismatch is caught BEFORE
      # publishing rather than discovered as a wrong version on the registry —
      # npm does not allow re-publishing a version.
      - name: The tag and package.json must agree
        run: |
          tag="${GITHUB_REF_NAME#react-native-v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $tag != package.json $pkg"
            exit 1
          fi

      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  flutter:
    if: startsWith(github.ref, 'refs/tags/flutter-v')
    runs-on: ubuntu-latest
    environment: release
    defaults:
      run:
        working-directory: packages/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      - name: The tag and pubspec.yaml must agree
        run: |
          tag="${GITHUB_REF_NAME#flutter-v}"
          pkg=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $tag != pubspec.yaml $pkg"
            exit 1
          fi

      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: flutter test

      # A dry run first: pub.dev publishes are PERMANENT — a version cannot be
      # replaced, only retracted — so the last cheap chance to catch a packaging
      # mistake is here.
      - name: Dry run
        run: flutter pub publish --dry-run
      - name: Publish
        run: flutter pub publish --force
