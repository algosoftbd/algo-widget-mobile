# Versioning, changelogs and tags — from the commits, then hand off to publish.
#
# Mirrors the AlgoSoft OS repo's Release Draft workflow (same action, same
# shape), with the one difference this repository forces: it holds TWO packages
# on independent version lines, so the action runs once per package, scoped by
# `git-path`. A commit touching only `packages/flutter` bumps `algo_widget` and
# leaves the npm package alone. That is the whole reason the tags are
# per-package.
#
# TWO JOBS, NOT TWO STEPS, and this cost a spurious release to learn. The action
# bumps the version file BEFORE it decides whether there is anything to release,
# and it commits with `git add .` — so with both packages in one job, a package
# with no releasable changes still had its manifest bumped, and the other
# package's release commit swept that bump up. The result was a React Native
# manifest reading 0.1.1 with no tag, no changelog and no release, inside a
# Flutter release commit. Separate jobs mean separate working trees: a skipped
# package leaves nothing behind for the other to stage.
#
# They run SEQUENTIALLY (`needs:`) because both push to `main`, and in parallel
# the loser gets a non-fast-forward — intermittently, depending on which
# finished first, which is the worst kind of failure to meet in a release
# pipeline.
#
# THE CHANGELOG IS GENERATED, not written. `release-count` means "preserve N
# releases" — it TRUNCATES rather than protects, so there is no setting that
# keeps hand-written prose in the file. That is the tool working as designed:
# CHANGELOG.md is a function of the commits. Prose that deserves to survive goes
# in the GitHub release notes, which are permanent and are where a customer
# arriving from npm or pub.dev actually reads — see the 0.1.0 releases.
#
# IT HANDS OFF TO `release.yml` BY DISPATCH, not by pushing a tag and hoping.
# A tag pushed with GITHUB_TOKEN deliberately does NOT fire a `push` event —
# GitHub's guard against a workflow triggering itself forever — so a
# tag-triggered release would simply never run, silently. `workflow_dispatch`
# is the documented exception to that rule, and it has a second advantage that
# matters here: it runs AGAINST THE TAG REF, which is what pub.dev's OIDC check
# authenticates.
#
# The GitHub release is created by `release.yml` AFTER the registry accepts the
# package, not here. A release that exists before the publish succeeds is a
# promise; one created after is a record.
name: Version

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Never cancel a run mid-way: it may already have tagged.
  group: version
  cancel-in-progress: false

permissions:
  contents: write
  # To dispatch release.yml. Without it the hand-off fails with a 403 that
  # reads like a token problem rather than a missing scope.
  actions: write

jobs:
  react-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The action reads the whole history to work out what changed since
          # the last tag. A shallow clone silently produces a first-release
          # changelog every time — and, with no tag to bound from, a version
          # computed off the entire history.
          fetch-depth: 0

      - name: Version, changelog, tag
        id: changelog
        uses: TriPSs/conventional-changelog-action@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          git-path: packages/react-native
          version-file: packages/react-native/package.json
          output-file: packages/react-native/CHANGELOG.md
          tag-prefix: react-native-v
          # Keeps package-lock.json's version in step with package.json's. The
          # action stages with `git add .`, so the sync lands in the same commit.
          pre-commit: ./scripts/release-pre-commit.cjs
          # Nothing to release is the NORMAL case: most commits touch one
          # package, and a docs change touches neither.
          skip-on-empty: true

      - name: Publish it
        if: steps.changelog.outputs.skipped == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --ref "${{ steps.changelog.outputs.tag }}"

      - name: Summary
        run: |
          if [ "${{ steps.changelog.outputs.skipped }}" = "false" ]; then
            echo "React Native → \`${{ steps.changelog.outputs.tag }}\` → publishing" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "React Native — no releasable changes" >> "$GITHUB_STEP_SUMMARY"
          fi

  flutter:
    # Sequential: see the header. Runs even if the first job found nothing,
    # which is the common case.
    needs: react-native
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Whatever the first job pushed. Without this the checkout is the
          # commit that TRIGGERED the run, and this job's own push would then
          # be a non-fast-forward.
          ref: main

      - name: Version, changelog, tag
        id: changelog
        uses: TriPSs/conventional-changelog-action@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          git-path: packages/flutter
          version-file: packages/flutter/pubspec.yaml
          output-file: packages/flutter/CHANGELOG.md
          tag-prefix: flutter-v
          skip-on-empty: true

      - name: Publish it
        if: steps.changelog.outputs.skipped == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --ref "${{ steps.changelog.outputs.tag }}"

      - name: Summary
        run: |
          if [ "${{ steps.changelog.outputs.skipped }}" = "false" ]; then
            echo "Flutter → \`${{ steps.changelog.outputs.tag }}\` → publishing" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Flutter — no releasable changes" >> "$GITHUB_STEP_SUMMARY"
          fi
